<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Réservez un rendez-vous avec la conseillère d’orientation (démo, données fictives)." />
    <title>CIO — Rendez-vous d'orientation</title>
    <script>
      // Apply the saved light/dark choice before the page draws, so a dark
      // page doesn't flash white first. Same key and values as src/lib/theme.js.
      try {
        const theme = localStorage.getItem('cio-theme')
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {
        // Storage blocked: the app sets the right look once it starts.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
